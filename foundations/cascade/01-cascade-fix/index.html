<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cascade Assignment</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div>
      <h1 id="important">I`m just a paragraph with extra bold text</h1>
      <p class="text-1">I`m a smaller paragraph,also with extra bold text</p>
    </div>
    <div>
      <button class="button-1">Confirm</button>
      <button class="button-2">Cancel</button>
    </div>
    <div>
      <p class="text-2">I`m div with thin text!</p>
      <p class="text-3">I`m a div with thin text and child div!</p>
      <p class="text-4">I`m a smaller child div with extra bold text</p>
    </div>
  </body>
</html>
